name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  PYTHON_VERSION: '3.13'

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      run: pytest

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run pre-commit hooks
      run: |
        pre-commit install
        pre-commit run --all-files

  build-and-security:
    name: Build Package & Security Scan
    runs-on: ubuntu-latest
    needs: [test, code-quality]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install build and security tooling
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install 'setuptools>=61' wheel 'build>=1.2,<2' 'twine>=6,<7' 'pip-audit>=2.9,<3' 'bandit>=1.8,<2'
        python -m pip check

    - name: Audit build, development and scanner dependencies
      run: |
        python -m pip freeze --all --exclude cpu-monitor > tooling-requirements.txt
        pip-audit --strict --no-deps --disable-pip -r tooling-requirements.txt \
          -f json -o tooling-audit.json

    - name: Scan application source
      run: bandit -r src/ -f json -o bandit-report.json

    - name: Build package
      run: python -m build --no-isolation

    - name: Check package integrity
      run: twine check dist/*

    - name: Install and check the wheel in a runtime-only environment
      run: |
        python -m venv .runtime-env
        .runtime-env/bin/python -m pip install --upgrade pip
        .runtime-env/bin/python -m pip install dist/*.whl
        .runtime-env/bin/python -m pip check
        .runtime-env/bin/cpu-monitor --help
        .runtime-env/bin/python -m pip freeze --all --exclude cpu-monitor > runtime-requirements.txt

    - name: Audit installed runtime dependencies
      run: |
        pip-audit --strict --no-deps --disable-pip -r runtime-requirements.txt \
          -f json -o runtime-audit.json

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-and-security-artifacts
        path: |
          dist/
          bandit-report.json
          tooling-requirements.txt
          tooling-audit.json
          runtime-requirements.txt
          runtime-audit.json

  deploy:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    needs: [test, code-quality, build-and-security]
    if: github.event_name == 'release'

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-and-security-artifacts
        path: artifacts/

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install deployment dependencies
      run: |
        python -m pip install --upgrade pip
        pip install twine

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload artifacts/dist/*
